# Optional: run SQL Server locally.  docker compose up -d
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports: ["1433:1433"]
    volumes: [mssql_data:/var/opt/mssql]
volumes:
  mssql_data:
